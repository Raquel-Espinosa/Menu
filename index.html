<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Centro de Aplicaciones · Operaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#E9EDF1;
    --surface:#FFFFFF;
    --ink:#101820;
    --muted:#5C6A78;
    --faint:#8B99A7;
    --line:#D6DCE3;
    --line-strong:#C2CAD3;
    --accent:#1D4ED8;
    --shadow:0 1px 2px rgba(16,24,32,.06), 0 6px 20px rgba(16,24,32,.05);
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(90deg, rgba(16,24,32,.02) 0 1px, transparent 1px 64px);
    color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}

  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}

  /* ---- Header ---- */
  header.top{
    border-bottom:1px solid var(--line-strong);
    background:rgba(233,237,241,.9);
    backdrop-filter:blur(6px);
    position:sticky;top:0;z-index:20;
  }
  .top-row{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:20px;flex-wrap:wrap;padding:22px 0 18px;
  }
  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);margin:0 0 6px;font-weight:600;
  }
  h1{
    font-family:"Barlow Condensed",sans-serif;
    font-weight:700;font-size:clamp(30px,5vw,46px);
    letter-spacing:.01em;line-height:.98;margin:0;text-transform:uppercase;
  }
  .counter{
    font-family:"IBM Plex Mono",monospace;font-weight:600;
    font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;
  }
  .counter b{color:var(--ink);font-size:26px;display:block;line-height:1;}

  /* ---- Search ---- */
  .searchbar{padding:0 0 18px;}
  .search{
    position:relative;max-width:420px;
  }
  .search input{
    width:100%;padding:11px 14px 11px 40px;
    border:1px solid var(--line-strong);border-radius:10px;
    background:var(--surface);color:var(--ink);
    font-family:"Inter",sans-serif;font-size:14px;
    box-shadow:var(--shadow);
  }
  .search input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);}

  /* ---- Sections ---- */
  main{padding:30px 0 60px;}
  .area{margin:0 0 34px;scroll-margin-top:120px;}
  .area-head{
    display:flex;align-items:center;gap:12px;
    padding:0 0 14px;border-bottom:1px solid var(--line);
    margin-bottom:16px;
  }
  .spine{width:6px;height:26px;border-radius:3px;flex:none;}
  .area-name{
    font-family:"Barlow Condensed",sans-serif;font-weight:700;
    font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:0;
  }
  .area-count{
    font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
    color:var(--muted);margin-left:auto;letter-spacing:.05em;
  }

  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:12px;
  }

  /* ---- Cards ---- */
  .card{
    position:relative;display:flex;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:15px 16px;
    box-shadow:var(--shadow);
    transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--dot,var(--accent));opacity:.85;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 2px 4px rgba(16,24,32,.08), 0 14px 30px rgba(16,24,32,.10);
    border-color:var(--line-strong);
  }
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .card-body{min-width:0;flex:1;}
  .card-name{
    font-weight:600;font-size:14.5px;color:var(--ink);
    line-height:1.3;margin:0 0 3px;
  }
  .card-tag{
    font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
    letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  }
  .tag-report{color:#B4632A;}
  .arrow{
    flex:none;color:var(--faint);transition:transform .14s ease,color .14s ease;
  }
  .card:hover .arrow{color:var(--accent);transform:translate(3px,-3px);}

  .empty{
    display:none;padding:40px 0;text-align:center;color:var(--muted);
    font-size:14px;
  }
  .empty.show{display:block;}

  footer{
    border-top:1px solid var(--line);padding:22px 0 40px;
    color:var(--faint);font-size:12px;
    font-family:"IBM Plex Mono",monospace;letter-spacing:.03em;
  }

  @media (max-width:520px){
    .grid{grid-template-columns:1fr;}
    .counter{text-align:left;}
  }
</style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="top-row">
        <div>
          <p class="eyebrow">Operaciones · Almacén</p>
          <h1>Centro de Aplicaciones</h1>
        </div>
        <div class="counter"><b id="total">0</b>herramientas</div>
      </div>
      <div class="searchbar">
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="q" type="text" placeholder="Buscar aplicación o área…" autocomplete="off" aria-label="Buscar aplicación" />
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="areas"></div>
    <div class="empty" id="empty">No se encontró ninguna aplicación con ese nombre.</div>
  </main>

  <footer class="wrap">
    <span id="foot"></span>
  </footer>

<script>
  const DATA = [
    { area:"Recibo", color:"#0E7C86", apps:[
      { name:"Registro de Entrada y salida de Hieleras", url:"https://raquel-espinosa.github.io/Hielera/" },
      { name:"CEDIS/DOCK — Sistema de Citas de Proveedores", url:"https://raquel-espinosa.github.io/Regis-Citas/" },
      { name:"Cómo van las Tarimas", url:"https://raquel-espinosa.github.io/ComovanTarimas/" },
      { name:"Palets Logísticos", url:"https://raquel-espinosa.github.io/Pallet-Logistics/" },
    ]},
    { area:"Mercancías Generales", color:"#2946C7", apps:[
      { name:"Productividad Alto-Costo", url:"https://raquel-espinosa.github.io/Prod-Alto-Costo/" },
      { name:"Distribuir Entregas para Pickear", url:"https://raquel-espinosa.github.io/Pickeo/" },
      { name:"Productividad de Pickeo", url:"https://raquel-espinosa.github.io/Produ-Pickeo/" },
      { name:"Programación de Actividades de Pickeo", url:"https://raquel-espinosa.github.io/P-pickeo/" },
    ]},
    { area:"Recursos Humanos", color:"#7A3EBB", apps:[
      { name:"Registro de Hrs Extras", url:"https://raquel-espinosa.github.io/HrsExtras/" },
      { name:"Registro de tiempo de Actividades", url:"https://raquel-espinosa.github.io/Reg-Activ/" },
    ]},
    { area:"Administración", color:"#B4632A", apps:[
      { name:"Registro de Incidencias", url:"https://raquel-espinosa.github.io/Incidencias/" },
      { name:"Control de Activo", url:"https://raquel-espinosa.github.io/Activo/" },
      { name:"Registro de llegada y entregas a tienda", url:"https://raquel-espinosa.github.io/TrackCedisPet/" },
      { name:"Resumen de llegadas a tienda", url:"https://datastudio.google.com/reporting/1acc294d-f4ae-4480-a9e8-16dcbd1df5a4/page/41jtF", report:true },
      { name:"Seguimiento del Movimiento de las RF", url:"https://raquel-espinosa.github.io/seguimiento-de-RF/" },
      { name:"Resumen de Embarques", url:"https://datastudio.google.com/reporting/cec6d1c1-d220-41d4-b051-5fe59af0b762/page/4INtF", report:true },
    ]},
    { area:"Armado", color:"#2E7D46", apps:[
      { name:"Registro de Tarimas por Armadores", url:"https://raquel-espinosa.github.io/registro-de-Armadores/" },
      { name:"Resumen de Armado", url:"https://datastudio.google.com/reporting/67db0ee4-cc92-4d60-b720-bec4ea42b7c7/page/PYCpF", report:true },
      { name:"Productividad de Montacarguistas", url:"https://raquel-espinosa.github.io/Montas/" },
    ]},
    { area:"Otros", color:"#55606C", apps:[
      { name:"App Clínica: registro de pacientes", url:"https://raquel-espinosa.github.io/RegistroPacientes/" },
      { name:"Ventas por WhatsApp", url:"https://raquel-espinosa.github.io/Ventas-por-Whatsapp/" },
      { name:"Subir Archivos a Google Drive", url:"https://raquel-espinosa.github.io/SubirArchivos/" },
      { name:"Creación de Prompts para IA", url:"https://markop007.github.io/SCRIPT-PROMT-BUILDER/" },
    ]},
    { area:"Avícola", color:"#C69214", apps:[
      { name:"Registro de Clientes", url:"https://raquel-espinosa.github.io/Registro-de-Clientes/" },
      { name:"Registro de las entregas de cajas de Huevo", url:"https://raquel-espinosa.github.io/AppVentas/" },
    ]},
  ];

  const arrowSVG = '<svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>';

  const total = DATA.reduce((n,a)=>n+a.apps.length,0);
  document.getElementById("total").textContent = total;
  document.getElementById("foot").textContent =
    total + " herramientas · " + DATA.length + " áreas · actualizado " +
    new Date().toLocaleDateString("es-MX",{year:"numeric",month:"long"});

  const areasEl = document.getElementById("areas");
  DATA.forEach(group => {
    const sec = document.createElement("section");
    sec.className = "area";
    sec.dataset.area = group.area.toLowerCase();

    const cards = group.apps.map(app => {
      const tag = app.report ? '<span class="card-tag tag-report">Reporte</span>' : '<span class="card-tag">Aplicación</span>';
      return `<a class="card" href="${app.url}" target="_blank" rel="noopener"
                 style="--dot:${group.color}"
                 data-name="${app.name.toLowerCase()}" data-area="${group.area.toLowerCase()}">
                <div class="card-body">
                  <p class="card-name">${app.name}</p>
                  ${tag}
                </div>${arrowSVG}
              </a>`;
    }).join("");

    sec.innerHTML =
      `<div class="area-head">
         <span class="spine" style="background:${group.color}"></span>
         <h2 class="area-name">${group.area}</h2>
         <span class="area-count">${group.apps.length}</span>
       </div>
       <div class="grid">${cards}</div>`;
    areasEl.appendChild(sec);
  });

  // Buscador
  const q = document.getElementById("q");
  const empty = document.getElementById("empty");
  q.addEventListener("input", () => {
    const term = q.value.trim().toLowerCase();
    let anyVisible = false;
    document.querySelectorAll(".area").forEach(sec => {
      let visibleInSec = 0;
      sec.querySelectorAll(".card").forEach(card => {
        const match = !term ||
          card.dataset.name.includes(term) ||
          card.dataset.area.includes(term);
        card.style.display = match ? "" : "none";
        if (match) visibleInSec++;
      });
      sec.style.display = visibleInSec ? "" : "none";
      if (visibleInSec) anyVisible = true;
    });
    empty.classList.toggle("show", !anyVisible);
  });
</script>
</body>
</html>
